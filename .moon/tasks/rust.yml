# Global tasks inherited by every project (all crates use the rust toolchain uniformly).
tasks:
  build:
    script: "cargo build -p $MOON_PROJECT_ID"
    inputs:
      - "src/**/*"
      - "Cargo.toml"

  test:
    script: "cargo test -p $MOON_PROJECT_ID"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"

  lint:
    script: "cargo clippy -p $MOON_PROJECT_ID --all-targets -- -D warnings"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"

  format:
    script: "cargo fmt -p $MOON_PROJECT_ID"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"

  format-check:
    script: "cargo fmt -p $MOON_PROJECT_ID -- --check"
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"

  audit:
    script: "cargo deny check advisories"
    inputs:
      - "Cargo.lock"
      - "Cargo.toml"

  publish:
    script: "cargo publish -p $MOON_PROJECT_ID"
    inputs:
      - "src/**/*"
      - "Cargo.toml"
