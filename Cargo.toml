[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.2"
edition = "2021"
repository = "https://github.com/orin-dx/callisto"
homepage = "https://github.com/orin-dx/callisto"
documentation = "https://docs.rs/callisto-cli"
keywords = ["monorepo", "changesets", "release-management", "versioning", "moon"]
categories = ["development-tools", "command-line-utilities"]

# Pinned once here, not per-crate: §M.1.1 notes that bump_version's byte-exactness claim
# (§6.2) is meaningless if two crates in the workspace disagree about what SemVer parsing
# and rendering do.
[workspace.dependencies]
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
indexmap = { version = "2", features = ["serde"] }
toml_edit = "0.22"
ignore = "0.4"
toml = "0.8"
serde_yaml = "0.9"
globset = "0.4"
camino = { version = "1", features = ["serde1"] }
dunce = "1"
path-slash = "0.2"
tempfile = "3"
miette = { version = "7", features = ["fancy"] }
petgraph = "0.6"
tracing = "0.1"
rstest = "0.23"
insta = { version = "1.41", features = ["json", "redactions"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

# Centralized workspace lints (stable since Rust 1.74)
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
let_underscore_drop = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
