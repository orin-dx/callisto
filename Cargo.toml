[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/orin-dx/callisto"

# Pinned once here, not per-crate: §M.1.1 notes that bump_version's byte-exactness claim
# (§6.2) is meaningless if two crates in the workspace disagree about what SemVer parsing
# and rendering do.
[workspace.dependencies]
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
indexmap = { version = "2", features = ["serde"] }
toml_edit = "0.22"
ignore = "0.4"
toml = "0.8"
serde_yaml = "0.9"
globset = "0.4"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

# Centralized workspace lints (stable since Rust 1.74)
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
