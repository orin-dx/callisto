# callisto configuration

[[fixed-group]]
name = "workspace"
members = [
    "callisto-model",
    "callisto-format",
    "callisto-conventional",
    "callisto-changelog",
    "callisto-manifests",
    "callisto-vcs",
    "callisto-graph",
    "callisto-cli",
    "callisto-moon",
    "callisto-fixtures",
]

[changesets]
dir = ".changeset"

[cascade]
mode = "out-of-range"
bump-severity = "patch"
peer-escalation = true
preserve-npm-ranges = true
