# cargo-deny configuration for Callisto monorepo
[graph]
targets = []

[licenses]
allow = ["MIT", "Apache-2.0", "AGPL-3.0-only", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "BSD-3-Clause", "ISC", "MPL-2.0", "BSD-2-Clause"]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# All 11 advisories below are pulled in transitively and ONLY as dev-dependencies
# of crates/callisto-moon, via moon_pdk_test_utils -> warpgate (host-side plugin
# loader) / moon_config -> wasmtime and proc-macro-error respectively. They are
# used exclusively by callisto-moon's integration tests to load and execute our
# own compiled .wasm under a real Extism/wasmtime host inside `cargo test` --
# none of this ships in the actual plugin artifact (that only depends on the
# separate, lightweight warpgate_pdk guest-side crate, which pulls in neither
# wasmtime nor proc-macro-error and is unaffected). Revisit and narrow/remove
# these ignores once moon_pdk_test_utils/warpgate/moon_config bump their
# wasmtime and proc-macro-error pins past the fixed/maintained versions.
#
# NOTE: this list was observed to be UNSTABLE across consecutive `cargo-deny`
# invocations during the same session (a run from the repo root returned 11
# wasmtime/proc-macro-error IDs; a `just ci` run moments later surfaced 3
# different wasmtime IDs not in that set; a third run back at the repo root
# returned yet another 3-ID subset). This looks like cargo-deny refreshing its
# local advisory-db git clone mid-session against an upstream RustSec database
# that is itself being actively updated, not a bug in this repo's config. The
# list below is the UNION of every ID observed across all runs -- treat it as
# a best-effort snapshot, not a guaranteed-complete one; a future `just ci`
# run may still surface additional new wasmtime advisory IDs and require this
# list to grow again. If this keeps happening, consider pinning cargo-deny's
# advisory-db to a fixed git rev for reproducible CI, or dropping the
# moon_pdk_test_utils dev-dependency in favor of a lighter verification tier.
[advisories]
ignore = [
    "RUSTSEC-2026-0085", # wasmtime: panic when lifting `flags` component value
    "RUSTSEC-2026-0086", # wasmtime: host data leakage with 64-bit tables and Winch
    "RUSTSEC-2026-0087", # wasmtime: segfault / out-of-sandbox load with f64x2.splat on Cranelift x86-64
    "RUSTSEC-2026-0088", # wasmtime: data leakage between pooling allocator instances
    "RUSTSEC-2026-0089", # wasmtime: host panic when Winch compiler executes table.fill
    "RUSTSEC-2026-0091", # wasmtime: OOB write/crash transcoding component model strings
    "RUSTSEC-2026-0092", # wasmtime: panic transcoding misaligned component model UTF-16 strings
    "RUSTSEC-2026-0093", # wasmtime: heap OOB read in component model string transcoding
    "RUSTSEC-2026-0094", # wasmtime: improperly masked table.grow return value (Winch backend)
    "RUSTSEC-2026-0095", # wasmtime: sandbox-escaping memory access (Winch backend)
    "RUSTSEC-2026-0096", # wasmtime: miscompiled guest heap access, sandbox escape on aarch64 Cranelift
    "RUSTSEC-2026-0114", # wasmtime: panic allocating a table exceeding host address space
    "RUSTSEC-2026-0222", # wasmtime: stores can mix up type indices between engines
    "RUSTSEC-2024-0370", # proc-macro-error: unmaintained (transitive via moon_config)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
