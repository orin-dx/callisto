# cargo-deny configuration for Callisto monorepo
[graph]
targets = []

[licenses]
allow = ["MIT", "Apache-2.0", "AGPL-3.0-only", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "BSD-3-Clause", "ISC", "MPL-2.0", "BSD-2-Clause", "FSL-1.1-MIT"]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
