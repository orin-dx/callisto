name: Hold release PR

on:
  push:
    branches:
      - main

permissions: {}

# One hold at a time, so concurrent runs never both create the state comment; a newer push replaces a queued run.
concurrency:
  group: hold-release-pr
  cancel-in-progress: false

jobs:
  hold:
    name: Hold the release PR until it is refreshed
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Draft the open release PR
        run: bash .github/scripts/hold-release-pr.sh callisto/version-packages
        env:
          GH_TOKEN: ${{ github.token }}
