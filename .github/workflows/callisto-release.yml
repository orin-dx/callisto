name: Release & Publish Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify CI Pipeline (Format, Lint, Test, WASM, Security Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Toolchain & Cache
        uses: ./.github/actions/setup-callisto

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Format Check
        run: just fmt-check

      - name: Clippy Lints
        run: just lint

      - name: Unit & Integration Tests
        run: just test

      - name: WASM Target Check
        run: just wasm-check

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Supply Chain Audit
        run: just audit

  release:
    name: Legacy release route (disabled during durable-release migration)
    needs: [verify]
    # The old composite action can independently publish, tag, and create a
    # forge release. Keep this job disabled until the separate plan/build/
    # Environment-gated execute jobs are connected to verified adapters.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Toolchain
        uses: ./.github/actions/setup-callisto
