name: Release & Publish Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify CI Pipeline (Format, Lint, Test, WASM, Security Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Toolchain & Cache
        uses: ./.github/actions/setup-callisto

      - name: Format Check
        run: moon run :format-check

      - name: Clippy Lints
        run: moon run :lint

      - name: Unit & Integration Tests
        run: moon run :test

      - name: WASM Target Check
        run: cargo check -p callisto-moon --target wasm32-wasip1 --features pdk

      - name: Supply Chain Audit
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: "advisories bans sources"

  release:
    name: Version Packages or Publish Release
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Toolchain
        uses: ./.github/actions/setup-callisto

      - name: Run Callisto Release Action
        uses: ./.github/actions/callisto-action
        with:
          publish: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN || secrets.CRATES_IO_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
