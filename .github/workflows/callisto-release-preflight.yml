name: Callisto Release Preflight

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-artifact-preflight:
    name: Release Artifact Preflight (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: callisto-x86_64-unknown-linux-gnu.tar.gz
            kind: cli
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: callisto-aarch64-unknown-linux-gnu.tar.gz
            kind: cli
          - id: linux-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: callisto-x86_64-unknown-linux-musl.tar.gz
            kind: cross
          - id: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            asset: callisto-aarch64-apple-darwin.tar.gz
            kind: cli
          - id: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            asset: callisto-x86_64-apple-darwin.tar.gz
            kind: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-key: ${{ matrix.target }}
      - name: Build the production artifact recipe
        env:
          CALLISTO_RELEASE_ARTIFACT_KIND: ${{ matrix.kind }}
          CALLISTO_RELEASE_ARTIFACT_TARGET: ${{ matrix.target }}
          CALLISTO_RELEASE_ARTIFACT_ASSET: ${{ matrix.asset }}
          CALLISTO_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
          CALLISTO_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifact-preflight
        run: bash .github/scripts/build-release-artifact.sh
