name: Callisto CI & Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-contracts:
    name: Workflow Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install workflow validation tools
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: ripgrep,zizmor@1.30.0
      - name: Lint workflow and action metadata
        # actionlint v1.7.12 predates GitHub's documented $/ self-repository
        # syntax. Keep all other actionlint diagnostics strict.
        uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 # v1.7.12
        with:
          # Docker action arguments are passed directly, rather than through a
          # shell. Keep the exception as one argument so its regex is intact.
          args: -color -ignore=\$/.+
      - name: Install just
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: just@1.58.0
      - name: Audit workflow and action security
        run: just zizmor
      - name: Verify workflow contracts
        run: just workflow-contracts

  fmt:
    name: Code Formatting (Moon & Just)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: just@1.58.0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          components: rustfmt
          targets: wasm32-wasip1
      - run: just fmt-check

  clippy:
    name: Clippy Lints (Moon & Just)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: just@1.58.0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          components: clippy
          targets: wasm32-wasip1
      - run: just lint
      - run: just doc-check

  test:
    name: Test Suite & WASM Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: just@1.58.0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-nextest
      - name: Install Verdaccio (real-registry npm e2e coverage)
        run: npm install -g verdaccio@6.10.4 # zizmor: ignore[adhoc-packages] pinned to an exact upstream release; a CI-only test-registry tool, not a shipped or lockfile-tracked dependency.
      - name: Install pypiserver (real-registry PyPI e2e coverage)
        # A venv, not --user: pins pypi-server, twine and build to exact
        # versions in one directory, same layout on both runner OSes. Its
        # bin/ carries both `python3` and `python` regardless of the base
        # interpreter's own name, and pypi_publish_argv resolves `python3`
        # first (falling back to `python`), so either name resolves here.
        # legacy-cgi: pypiserver 2.4.0 (its latest release) imports the
        # stdlib `cgi` module, removed in Python 3.13 (PEP 594); macOS
        # runners' `python3` is already past that line, so without this
        # pypi-server crashes on startup with ModuleNotFoundError before
        # ever binding its port. A no-op on a Python that still has the
        # real stdlib module (verified: the real one still wins the import).
        # gunicorn: the test passes `--server gunicorn` to pypi-server --
        # every other backend (the `auto` default's `wsgiref` fallback,
        # `paste`, gevent's `pywsgi`) resolves the bind address via
        # `socket.getfqdn()` before listening, measured to take 12-35s on a
        # machine exhibiting the same slow-reverse-DNS symptom the CI macOS
        # runner hit; gunicorn has no such call and measured under 1s.
        run: |
          python3 -m venv "$RUNNER_TEMP/pypi-e2e-venv"
          "$RUNNER_TEMP/pypi-e2e-venv/bin/pip" install pypiserver==2.4.0 twine==6.2.0 build==1.4.4 legacy-cgi==2.6.3 gunicorn==26.2.0
          echo "$RUNNER_TEMP/pypi-e2e-venv/bin" >> "$GITHUB_PATH"
      - run: just test
      - run: just release-workflow-behavior
      - name: Verify Release-PR action against the real callisto binary
        run: bash .github/actions/callisto-action/tests/test_release_pr_decide_binary_contract.sh
      - run: just wasm-check

  test-default-features:
    name: Test Suite (Default Features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: just@1.58.0
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-nextest
      - run: just test-ci-default-features

  release-artifact-preflight:
    name: Release Artifact Preflight (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            asset: callisto-aarch64-apple-darwin.tar.gz
            kind: cli
          - id: linux-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: callisto-x86_64-unknown-linux-gnu.tar.gz
            kind: cli
          - id: linux-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: callisto-x86_64-unknown-linux-musl.tar.gz
            kind: cross
          - id: wasm-wasi
            runner: ubuntu-latest
            target: wasm32-wasip1
            asset: callisto-moon.wasm
            kind: wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
      - name: Build the production artifact recipe
        env:
          CALLISTO_RELEASE_ARTIFACT_KIND: ${{ matrix.kind }}
          CALLISTO_RELEASE_ARTIFACT_TARGET: ${{ matrix.target }}
          CALLISTO_RELEASE_ARTIFACT_ASSET: ${{ matrix.asset }}
          CALLISTO_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
          CALLISTO_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifact-preflight
        run: bash .github/scripts/build-release-artifact.sh

  coverage:
    name: Code Coverage & Test Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: just@1.58.0
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-llvm-cov
      - run: just wasm-check
      - run: just coverage 90
      # Non-blocking for now: the workspace-total gate above can pass while
      # a small crate is far below threshold (a few large crates dominate
      # the total line count). Visible in logs so regressions get noticed;
      # promote to a required check once existing per-crate gaps are closed.
      - run: just coverage-per-crate 90 || echo "::warning::one or more crates below 90% line coverage (non-blocking, see job log above)"

  security:
    name: Security & Advisory Audit (Moon & Just)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: just@1.58.0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-deny
      - run: just audit

  validate:
    name: Validate Changesets & Workspace Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/callisto-validate
