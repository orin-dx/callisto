name: Callisto CI & Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-contracts:
    name: Workflow Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install workflow validation tools
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2
        with:
          tool: ripgrep
      - name: Verify pinned actions
        run: bash .github/tests/verify-action-pins.sh
      - name: Verify Release-PR action contract
        run: env PATH=/usr/bin:/bin bash .github/actions/callisto-action/tests/test_release_pr_contract.sh

  fmt:
    name: Code Formatting (Moon & Just)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          components: rustfmt
          targets: wasm32-wasip1
      - run: just fmt-check

  clippy:
    name: Clippy Lints (Moon & Just)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          components: clippy
          targets: wasm32-wasip1
      - run: just lint

  test:
    name: Test Suite & WASM Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2
        with:
          tool: cargo-nextest
      - run: just test-ci
      - run: just wasm-check
      - name: Upload Nextest report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: callisto-nextest-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Code Coverage & Test Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2
        with:
          tool: cargo-llvm-cov
      - run: just wasm-check
      - run: just coverage 90
      # Non-blocking for now: the workspace-total gate above can pass while
      # a small crate is far below threshold (a few large crates dominate
      # the total line count). Visible in logs so regressions get noticed;
      # promote to a required check once existing per-crate gaps are closed.
      - run: just coverage-per-crate 90 || echo "::warning::one or more crates below 90% line coverage (non-blocking, see job log above)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: code-coverage-report
          path: lcov.info
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Security & Advisory Audit (Moon & Just)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2
        with:
          tool: cargo-deny
      - run: just audit

  validate:
    name: Validate Changesets & Workspace Status
    needs: [workflow-contracts, fmt, clippy, test, coverage, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/callisto-validate
      - name: Verify Release-PR action contract
        # Keep this lightweight validation job independent of `just`: the
        # executable contract is a standalone Bash test and the action above
        # installs only the Callisto runtime it needs.
        run: bash .github/actions/callisto-action/tests/test_release_pr_contract.sh
