name: Verify Real Nightly

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
  push:
    branches: [wp-nightly-verify-real]

permissions:
  contents: read

jobs:
  verify-real:
    name: Verify Real
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: just@1.58.0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
      - name: Install registry test tools
        uses: $/.github/actions/install-registry-test-tools
      - run: just verify-real
