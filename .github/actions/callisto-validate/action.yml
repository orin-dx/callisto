name: 'Callisto Validate Action'
description: 'Validates pending changesets and renders workspace status summary'

runs:
  using: 'composite'
  steps:
    - name: Setup Callisto Environment
      uses: ./.github/actions/setup-callisto

    - name: Validate Changesets
      shell: bash
      env:
        FORCE_COLOR: "1"
        CLICOLOR_FORCE: "1"
      run: callisto validate

    - name: Render Workspace Status Summary
      shell: bash
      env:
        FORCE_COLOR: "1"
        CLICOLOR_FORCE: "1"
      run: |
        echo "### Callisto Workspace Status" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        callisto status >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
