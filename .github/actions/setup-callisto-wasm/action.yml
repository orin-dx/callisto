name: 'Setup Callisto WASM'
description: 'Pre-downloads and caches callisto-moon.wasm from GitHub Releases for Moon integration'
inputs:
  version:
    description: 'Callisto WASM version to download (defaults to "latest")'
    required: false
    default: 'latest'
  dest:
    description: 'Destination path for callisto-moon.wasm'
    required: false
    default: '.moon/cache/ext/callisto-moon.wasm'
  verification:
    description: >-
      Attestation verification of the downloaded plugin (gh attestation verify). One of: require =
      a failed verification or missing gh aborts and the plugin is deleted; fallback (default) =
      identical to require, because no source-install alternative exists for the wasm plugin
      (the error says so); skip = do not verify, warn, and use the plugin. Releases built before
      the first attested release carry no attestation; use skip for those.
    required: false
    default: 'fallback'

outputs:
  path:
    description: 'Path to the local cached callisto-moon.wasm file'
    value: ${{ steps.download-wasm.outputs.path || inputs.dest }}

runs:
  using: 'composite'
  steps:
    - name: Cache Callisto WASM
      id: cache-wasm
      # actions/cache v4.2.3
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: ${{ inputs.dest }}
        key: ${{ runner.os }}-callisto-wasm-${{ inputs.version }}

    - name: Download Callisto WASM Plugin
      id: download-wasm
      if: steps.cache-wasm.outputs.cache-hit != 'true'
      shell: bash
      env:
        INPUT_WASM_DEST: ${{ inputs.dest }}
        INPUT_WASM_VERSION: ${{ inputs.version }}
        INPUT_WASM_VERIFICATION: ${{ inputs.verification }}
        GH_TOKEN: ${{ github.token }}
      run: |
        DEST_PATH="$INPUT_WASM_DEST"
        mkdir -p "$(dirname "$DEST_PATH")"
        TAG_NAME="$INPUT_WASM_VERSION"
        VERIFICATION="${INPUT_WASM_VERIFICATION:-fallback}"
        case "$VERIFICATION" in
          require|fallback|skip) ;;
          *)
            echo "::error::unsupported setup-callisto-wasm verification '$VERIFICATION' (valid values: require, fallback, skip)"
            exit 1
            ;;
        esac

        if [[ "$TAG_NAME" == "latest" ]]; then
          DOWNLOAD_URL="https://github.com/orin-dx/callisto/releases/latest/download/callisto-moon.wasm"
        else
          DOWNLOAD_URL="https://github.com/orin-dx/callisto/releases/download/${TAG_NAME}/callisto-moon.wasm"
        fi

        echo "Downloading Callisto WASM plugin from $DOWNLOAD_URL to $DEST_PATH..."
        if curl -sL -f "$DOWNLOAD_URL" -o "$DEST_PATH"; then
          if [[ "$VERIFICATION" == "skip" ]]; then
            echo "::warning::verification=skip: the WASM plugin was not verified"
          else
            REASON=""
            if ! command -v gh >/dev/null 2>&1; then
              REASON="gh is not installed"
            elif ! gh attestation verify "$DEST_PATH" \
                --repo orin-dx/callisto \
                --signer-workflow orin-dx/callisto/.github/workflows/callisto-release.yml \
                --deny-self-hosted-runners; then
              REASON="attestation verification failed"
            fi
            if [[ -n "$REASON" ]]; then
              rm -f "$DEST_PATH"
              if [[ "$VERIFICATION" == "fallback" ]]; then
                echo "::error::cannot verify callisto-moon.wasm: $REASON; no fallback exists for the wasm plugin, so verification=fallback behaves like require"
              else
                echo "::error::cannot verify callisto-moon.wasm: $REASON (verification=require)"
              fi
              exit 1
            fi
          fi
        else
          echo "Release binary asset not found. Compiling Callisto WASM plugin locally..."
          rustup target add wasm32-wasip1 2>/dev/null || true
          cargo build -p callisto-moon --target wasm32-wasip1 --features pdk --release
          cp target/wasm32-wasip1/release/callisto_moon.wasm "$DEST_PATH"
        fi

        echo "path=$DEST_PATH" >> $GITHUB_OUTPUT
