name: 'Callisto Release-PR Action'
description: 'Creates or updates a Callisto release PR; durable execution belongs to the repository workflow'
inputs:
  version_command:
    description: 'Version command; defaults to callisto version'
    required: false
    default: 'callisto version'
  commit_message:
    description: 'Release-PR commit message'
    required: false
    default: 'chore(release): version packages'
  title:
    description: 'Release-PR title'
    required: false
    default: 'chore(release): version packages'
  pr_label:
    description: 'Release-PR label'
    required: false
    default: 'callisto: release'
  setup_git_user:
    description: 'Configure github-actions[bot] before committing'
    required: false
    default: 'true'
  branch:
    description: 'Base branch for the release PR'
    required: false
    default: 'main'
  release_branch:
    description: 'Branch managed for the release PR'
    required: false
    default: 'callisto/version-packages'
  setup_callisto:
    description: 'Install the Callisto environment before running'
    required: false
    default: 'true'
  cwd:
    description: 'Workspace directory'
    required: false
    default: '.'
outputs:
  hasChangesets:
    description: 'Whether pending changesets were found'
    value: ${{ steps.version-pr.outputs.hasChangesets }}
  published:
    description: 'Always false: this action never publishes'
    value: 'false'
  publishedPackages:
    description: 'Always an empty JSON array'
    value: '[]'
  nativeMatrix:
    description: 'Native build matrix preview'
    value: ${{ steps.version-pr.outputs.nativeMatrix }}
runs:
  using: composite
  steps:
    - name: Setup Callisto Environment
      if: inputs.setup_callisto == 'true'
      uses: ./.github/actions/setup-callisto
    - name: Create or update release PR
      id: version-pr
      shell: bash
      env:
        INPUT_VERSION_COMMAND: ${{ inputs.version_command }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_PR_LABEL: ${{ inputs.pr_label }}
        INPUT_SETUP_GIT_USER: ${{ inputs.setup_git_user }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_RELEASE_BRANCH: ${{ inputs.release_branch }}
        INPUT_CWD: ${{ inputs.cwd }}
        # GitHub exposes the installation token as a context, not a guaranteed
        # inherited environment variable. Using the context also works for the
        # repository workflow that invokes this action after checkout.
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd "$INPUT_CWD"
        set +e
        callisto status --check
        status=$?
        set -e
        case "$status" in
          1) echo 'hasChangesets=true' >> "$GITHUB_OUTPUT" ;;
          2)
            echo 'hasChangesets=false' >> "$GITHUB_OUTPUT"
            matrix=$(callisto matrix --format json | jq -c '[.platformTargets[].targets[]] | unique_by(.artifactName)')
            echo "nativeMatrix=$matrix" >> "$GITHUB_OUTPUT"
            echo '::notice::No changesets. This action does not publish, tag, download artifacts, or create releases; use the durable repository workflow.'
            exit 0
            ;;
          *) echo "::error::callisto status --check exited $status"; exit 1 ;;
        esac
        # A managed branch must have at most one open PR to its configured
        # base. Selecting the first result would make an ambiguous repository
        # state silently mutate the wrong PR.
        prs=$(gh pr list --state open --head "$INPUT_RELEASE_BRANCH" --base "$INPUT_BRANCH" --json number,body)
        pr_count=$(jq 'length' <<< "$prs")
        case "$pr_count" in
          0) existing='' ;;
          1) existing=$(jq -r '.[0].body // empty' <<< "$prs") ;;
          *) echo "::error::found $pr_count open release PRs for $INPUT_RELEASE_BRANCH -> $INPUT_BRANCH"; exit 1 ;;
        esac
        if [[ -n "$existing" ]]; then
          body=$(printf '%s' "$existing" | callisto compose-pr-body --existing-body - --label "$INPUT_PR_LABEL" --branch "$INPUT_BRANCH" --format text)
        else
          body=$(callisto compose-pr-body --label "$INPUT_PR_LABEL" --branch "$INPUT_BRANCH" --format text)
        fi
        read -ra command <<< "$INPUT_VERSION_COMMAND"
        "${command[@]}"
        test -n "$(git status --porcelain)" || { echo '::error::pending changesets produced no release-PR delta'; exit 1; }
        if [[ "$INPUT_SETUP_GIT_USER" == true ]]; then
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        fi
        git switch -C "$INPUT_RELEASE_BRANCH"
        git add -A
        git commit -m "$INPUT_COMMIT_MESSAGE"
        git push --force-with-lease origin "$INPUT_RELEASE_BRANCH"
        label_exists=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/labels?per_page=100" --slurp --jq 'any(.[][]; .name == env.INPUT_PR_LABEL)')
        if [[ "$label_exists" != true ]]; then
          gh label create "$INPUT_PR_LABEL" --color 0e8a16 --description 'Callisto release packages'
        fi
        pr=$(jq -r '.[0].number // empty' <<< "$prs")
        if [[ -n "$pr" ]]; then
          gh pr edit "$pr" --title "$INPUT_TITLE" --body "$body" --add-label "$INPUT_PR_LABEL"
        else
          gh pr create --head "$INPUT_RELEASE_BRANCH" --base "$INPUT_BRANCH" --title "$INPUT_TITLE" --body "$body" --label "$INPUT_PR_LABEL"
        fi
