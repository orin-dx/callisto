version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      routine-actions:
        applies-to: version-updates
        patterns: ["*"]
      security-actions:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      routine-crates:
        applies-to: version-updates
        patterns: ["*"]
      security-crates:
        applies-to: security-updates
        patterns: ["*"]
