[test-groups]
moon-sandbox = { max-threads = 1 }

[[profile.default.overrides]]
# `binary()` matches on the integration-test binary name, not the test
# function name. `test(moon_wasm_sandbox)` matches nothing because individual
# test function names don't contain "moon_wasm_sandbox"; `binary()` does.
filter = "binary(moon_wasm_sandbox)"
# WASM sandbox tests share global WasmHost state and must run serially.
test-group = "moon-sandbox"
