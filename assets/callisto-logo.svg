<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&amp;display=swap');
      .logo-title {
        font-family: 'Outfit', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 52px;
        letter-spacing: 0.22em;
        text-anchor: middle;
      }
      .logo-sub {
        font-family: 'Outfit', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.45em;
        text-anchor: middle;
      }
    </style>
    <linearGradient id="logoIconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3a7bd5" />
      <stop offset="100%" stop-color="#8e2de2" />
    </linearGradient>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Icon Mark -->
  <g transform="translate(140, 15)">
    <path d="M 115,15 C 160,15 190,50 175,100 C 160,150 110,180 60,160 C 95,160 140,135 145,95 C 150,55 115,25 115,15 Z" fill="url(#logoIconGrad)" />
    <path d="M 45,135 C 50,175 105,185 155,135 C 188,102 198,58 170,30" fill="none" stroke="url(#logoIconGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="92" cy="65" r="5" fill="#00d2ff" />
    <circle cx="110" cy="98" r="5" fill="#00d2ff" />
    <circle cx="132" cy="135" r="5" fill="#00d2ff" />
    <circle cx="180" cy="42" r="5" fill="#3a7bd5" />
    <circle cx="192" cy="28" r="7" fill="#8e2de2" />
    <circle cx="204" cy="12" r="9" fill="#8e2de2" />
  </g>
  <!-- Logotype -->
  <text x="250" y="265" class="logo-title" fill="url(#logoTextGrad)">CALLISTO</text>
  <text x="250" y="305" class="logo-sub" fill="#0284c7">RELEASE ENGINE</text>
</svg>
