[package]
name = "callisto-vcs"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Native Git and VCS operations for callisto powered by gix (gitoxide)."
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
callisto-model = { path = "../callisto-model", version = "0.3.0" }
thiserror = { workspace = true }
miette = { workspace = true }
globset = { workspace = true }
dunce = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gix = "0.86"

[dev-dependencies]
tempfile = "3"
