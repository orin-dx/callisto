[package]
name = "callisto-model"
version = "0.6.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Callisto Release Engine — Core domain primitives, SemVer grammars, and plan models."
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
# Exposes `ApplyPermit::force_for_tests` to other crates' test targets. Enable
# only under `[dev-dependencies]`; a `[dependencies]` entry would let
# production code mint write permits without consulting the dry-run flag.
test-util = []

[dependencies]
semver.workspace = true
pep440_rs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
miette.workspace = true
camino.workspace = true
path-slash.workspace = true
schemars.workspace = true
tempfile.workspace = true
sha2.workspace = true
base64.workspace = true

[dev-dependencies]
proptest.workspace = true
