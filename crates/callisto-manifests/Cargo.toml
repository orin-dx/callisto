[package]
name = "callisto-manifests"
version = "0.6.0"
edition.workspace = true
license = "AGPL-3.0-only"
description = "Callisto Release Engine — CST-preserving manifest editors for Cargo.toml, package.json, and pyproject.toml."
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["cargo", "npm", "pypi"]
cargo = ["dep:toml_edit"]
npm = []
pypi = ["dep:toml_edit"]
go = []
maven = []
nuget = []
deno = []

[dependencies]
callisto-model = { path = "../callisto-model", version = "0.6.0" }
camino.workspace = true
toml_edit = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
indexmap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
callisto-model = { path = "../callisto-model", features = ["test-util"] }
callisto-fixtures = { path = "../callisto-fixtures", default-features = false }
tempfile.workspace = true
proptest.workspace = true
serial_test.workspace = true
