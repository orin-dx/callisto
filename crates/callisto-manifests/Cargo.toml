[package]
name = "callisto-manifests"
version = "0.14.2"
edition.workspace = true
license = "FSL-1.1-MIT"
description = "Callisto Release Engine — CST-preserving manifest editors for Cargo.toml, package.json, and pyproject.toml."
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["tests/", "proptest-regressions/"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
callisto-model = { path = "../callisto-model", version = "0.14.2" }
camino.workspace = true
toml_edit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
indexmap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
callisto-model = { path = "../callisto-model", features = ["test-util"] }
callisto-fixtures = { path = "../callisto-fixtures" }
tempfile.workspace = true
proptest.workspace = true
serial_test.workspace = true
