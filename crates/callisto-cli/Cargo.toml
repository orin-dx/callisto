[package]
name = "callisto-cli"
version = "0.13.0"
edition.workspace = true
license = "FSL-1.1-MIT"
description = "Callisto Release Engine — Polyglot monorepo versioning and release management CLI."
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["tests/", "proptest-regressions/"]
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "callisto"
path = "src/main.rs"

[dependencies]
callisto-graph = { path = "../callisto-graph", version = "0.13.0" }
callisto-manifests = { path = "../callisto-manifests", version = "0.13.0" }
callisto-model = { path = "../callisto-model", version = "0.13.0" }
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
miette = { workspace = true }
anstream = "1.0"
comfy-table = "8"
similar = { version = "3", features = ["inline"] }
schemars = { workspace = true }
dialoguer = "0.12"
dunce = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
callisto-model = { path = "../callisto-model", features = ["test-util"] }
tempfile = { workspace = true }
callisto-fixtures = { path = "../callisto-fixtures" }
callisto-manifests = { path = "../callisto-manifests" }
callisto-graph = { path = "../callisto-graph" }
trycmd = "1.2"
rstest.workspace = true
insta.workspace = true
base64.workspace = true
jsonschema = { version = "0.58", default-features = false }
