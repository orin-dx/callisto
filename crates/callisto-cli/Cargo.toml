[package]
name = "callisto-cli"
version = "0.6.0"
edition.workspace = true
license = "AGPL-3.0-only"
description = "Callisto Release Engine — Polyglot monorepo versioning and release management CLI."
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "callisto"
path = "src/main.rs"

[features]
default = ["cargo", "npm"]
cargo = ["callisto-graph/cargo"]
npm = ["callisto-graph/npm"]
inference = ["callisto-graph/inference"]
wrapper = []

[dependencies]
callisto-changelog = { path = "../callisto-changelog", version = "0.6.0" }
callisto-conventional = { path = "../callisto-conventional", version = "0.6.0" }
callisto-format = { path = "../callisto-format", version = "0.6.0" }
callisto-graph = { path = "../callisto-graph", version = "0.6.0" }
callisto-manifests = { path = "../callisto-manifests", version = "0.6.0" }
callisto-model = { path = "../callisto-model", version = "0.6.0" }
callisto-vcs = { path = "../callisto-vcs", version = "0.6.0" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
miette = { workspace = true }
anstream = "0.6"
comfy-table = "7"
similar = { version = "2", features = ["inline"] }
schemars = { workspace = true }
dialoguer = "0.11"
dunce = { workspace = true }
path-slash = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
callisto-model = { path = "../callisto-model", features = ["test-util"] }
tempfile = { workspace = true }
callisto-fixtures = { path = "../callisto-fixtures" }
callisto-manifests = { path = "../callisto-manifests" }
callisto-graph = { path = "../callisto-graph" }
trycmd = "0.15"
rstest.workspace = true
insta.workspace = true
base64.workspace = true
