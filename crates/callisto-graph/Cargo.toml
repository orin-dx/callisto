[package]
name = "callisto-graph"
version = "0.13.0"
edition.workspace = true
license = "FSL-1.1-MIT"
description = "Callisto Release Engine — Dependency graph, cascade, version planning, changelogs and release execution."
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["tests/", "proptest-regressions/"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
tempfile = { workspace = true }
sha2 = { workspace = true }
callisto-model = { path = "../callisto-model", version = "0.13.0" }
callisto-manifests = { path = "../callisto-manifests", version = "0.13.0" }
michi-graph = { workspace = true }
dunce = { workspace = true }
ignore = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
globset = { workspace = true }
yaml-rust2 = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true }
indexmap = { workspace = true }
url = { workspace = true }

[dev-dependencies]
proptest.workspace = true
callisto-model = { path = "../callisto-model", features = ["test-util"] }
callisto-fixtures = { path = "../callisto-fixtures" }
tempfile = { workspace = true }
rstest.workspace = true
insta.workspace = true
serial_test.workspace = true
temp-env = "0.3"
