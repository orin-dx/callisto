[package]
name = "callisto-graph"
version = "0.6.0"
edition.workspace = true
license = "AGPL-3.0-only"
description = "Callisto Release Engine — Dependency DAG solver and topological cascade release planner."
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["cargo", "npm"]
cargo = ["callisto-manifests/cargo"]
npm = ["callisto-manifests/npm"]
inference = ["dep:callisto-conventional"]

[dependencies]
tempfile = { workspace = true }
callisto-model = { path = "../callisto-model", version = "0.6.0" }
callisto-vcs = { path = "../callisto-vcs", version = "0.6.0" }
callisto-manifests = { path = "../callisto-manifests", version = "0.6.0" }
callisto-format = { path = "../callisto-format", version = "0.6.0" }
callisto-changelog = { path = "../callisto-changelog", version = "0.6.0" }
callisto-conventional = { path = "../callisto-conventional", version = "0.6.0", optional = true }
dunce = { workspace = true }
ignore = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
globset = { workspace = true }
yaml-rust2 = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true }
indexmap = { workspace = true }
petgraph = { workspace = true }
url = { workspace = true }

[dev-dependencies]
callisto-model = { path = "../callisto-model", features = ["test-util"] }
callisto-fixtures = { path = "../callisto-fixtures" }
tempfile = { workspace = true }
rstest.workspace = true
insta.workspace = true
serial_test.workspace = true
