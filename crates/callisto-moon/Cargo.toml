[package]
name = "callisto-moon"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
description = "Callisto Release Engine — Moon WASM PDK plugin for polyglot monorepo release automation."
repository.workspace = true
readme = "README.md"

[features]
default = []
pdk = ["dep:extism-pdk"]

[dependencies]
callisto-model = { path = "../callisto-model", version = "0.3.0" }
callisto-graph = { path = "../callisto-graph", version = "0.3.0" }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
extism-pdk = { version = "1.0", optional = true }
